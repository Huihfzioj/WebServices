version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================
  
  mysql:
    image: mysql:8.0
    container_name: projetsoc_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_DATABASE: "administration"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projetsoc_network
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: projetsoc_mongodb
    environment:
      MONGO_INITDB_DATABASE: "public_services_db"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projetsoc_network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: projetsoc_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projetsoc_network
    restart: unless-stopped

  # ============================================
  # MICROSERVICES
  # ============================================

  administrativerequests:
    build:
      context: .
      dockerfile: ./AdministrativeRequests/Dockerfile
    container_name: administrativerequests
    environment:
      SERVER_PORT: "8081"
      SPRING_APPLICATION_NAME: "AdministrativeRequests"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/administration?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "0000"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: "DEBUG"
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projetsoc_network
    restart: on-failure

  civilregistry:
    build:
      context: .
      dockerfile: ./civilRegistry/Dockerfile
    container_name: civilregistry
    environment:
      SERVER_PORT: "8084"
      SPRING_APPLICATION_NAME: "CivilRegistry"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/civil_registry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "0000"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.MySQL8Dialect"
    ports:
      - "8084:8084"
      - "8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projetsoc_network
    restart: on-failure

  publicservices:
    build:
      context: .
      dockerfile: ./PublicServices/Dockerfile
    container_name: publicservices
    environment:
      SERVER_PORT: "8082"
      SPRING_APPLICATION_NAME: "PublicServices"
      SPRING_DATA_MONGODB_DATABASE: "public_services_db"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/public_services_db"
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - projetsoc_network
    restart: on-failure

  queueandupdate:
    build:
      context: .
      dockerfile: ./QueueAndUpdate/Dockerfile
    container_name: queueandupdate
    environment:
      SERVER_PORT: "8085"
      GRPC_SERVER_PORT: "9090"
      SPRING_APPLICATION_NAME: "QueueAndUpdate"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      SERVER_HTTP2_ENABLED: "true"
      GRPC_SERVER_SECURITY_ENABLED: "false"
      LOGGING_LEVEL_NET_DEVH_BOOT_GRPC: "DEBUG"
    ports:
      - "8085:8085"
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - projetsoc_network
    restart: on-failure

  # ============================================
  # API GATEWAY (ORCHESTRATOR)
  # ============================================

  gateway:
    build:
      context: .
      dockerfile: ./Gateway/Dockerfile
    container_name: gateway
    environment:
      SERVER_PORT: "8086"
      SPRING_APPLICATION_NAME: "APIGateway"
      SPRING_MAIN_WEB_APPLICATION_TYPE: "reactive"
      
      # Route 0: Admin Requests (REST)
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "admin-requests"
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://administrativerequests:8081"
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/api/requests/**"
      
      # Route 1: Public Services (GraphQL)
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: "public-services"
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://publicservices:8082"
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/graphql"
      
      # Route 2: Civil Registry (SOAP)
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: "civil-registry"
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://civilregistry:8084"
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/CivilRegistry"
      
      # Route 3: Queue and Update (gRPC)
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: "queue-and-update"
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: "http://queueandupdate:8085"
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: "Path=/queue/**"
      
    ports:
      - "8086:8086"
    depends_on:
      - administrativerequests
      - civilregistry
      - publicservices
      - queueandupdate
    networks:
      - projetsoc_network
    restart: on-failure

volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  projetsoc_network:
    driver: bridge
